<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none" width="380" height="90">
  <style>
    .title-dente-w { font-family: 'Manrope', 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 42px; fill: #FFFFFF; letter-spacing: -0.03em; }
    .title-sim-w { font-family: 'Manrope', 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 42px; fill: #60B7EC; letter-spacing: -0.03em; }
    .subtitle-w { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 11px; fill: #E2F2FC; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.9; }
  </style>
  <g transform="translate(10, 8)">
    <!-- Icon Tooth + Smile Arc Graphic -->
    <g transform="translate(0, 4)">
      <!-- Tooth Silhouette -->
      <path d="M22 6C14 6 8 12 8 21C8 28 11 34 14 42C17 50 19 60 23 60C26 60 27 52 30 46C33 52 34 60 37 60C41 60 43 50 46 42C49 34 52 28 52 21C52 12 46 6 38 6C34 6 31 8.5 30 11C29 8.5 26 6 22 6Z" fill="#FFFFFF" opacity="0.2" />
      <path d="M22 8C15.5 8 10 13.5 10 21C10 27.5 13 33 16 40.5C18.8 47.5 20.5 56 23 56C25.5 56 26.5 49 29 43.5C30 41.3 30 41.3 31 43.5C33.5 49 34.5 56 37 56C39.5 56 41.2 47.5 44 40.5C47 33 50 27.5 50 21C50 13.5 44.5 8 38 8C34.5 8 31.8 10.2 30 12.8C28.2 10.2 25.5 8 22 8Z" fill="url(#tooth-grad-w)" />
      <!-- Curved Smile Arc Under Tooth -->
      <path d="M5 48C18 64 42 64 55 48" stroke="#E25B98" stroke-width="4.5" stroke-linecap="round" />
    </g>
    
    <!-- Text Group -->
    <g transform="translate(72, 42)">
