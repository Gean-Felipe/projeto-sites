        <tspan class="title-dente-w">Dente</tspan>
        <tspan class="title-sim-w">Sim</tspan>
      </text>
      <text x="2" y="20" class="subtitle-w">CLÍNICA ODONTOLÓGICA</text>
    </g>
  </g>
  
  <defs>
    <linearGradient id="tooth-grad-w" x1="10" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#93D0F5" />
    </linearGradient>
  </defs>
</svg>
